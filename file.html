<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rendered Markdown</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" media="(prefers-color-scheme: dark)" />
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #24292f;
            --link-color: #0969da;
            --border-color: #d0d7de;
            --code-bg: #f6f8fa;
            --quote-color: #57606a;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0d1117;
                --text-color: #c9d1d9;
                --link-color: #58a6ff;
                --border-color: #30363d;
                --code-bg: #161b22;
                --quote-color: #8b949e;
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1, h2, h3 {
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.3em;
            margin-top: 24px;
            margin-bottom: 16px;
        }
        a { color: var(--link-color); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Inline code styling */
        :not(pre) > code {
            padding: 0.2em 0.4em;
            background-color: var(--code-bg);
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
            font-size: 85%;
        }

        /* Code block container */
        pre {
            padding: 16px;
            background-color: var(--code-bg) !important;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: auto;
            margin: 1em 0;
        }
        pre code {
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace !important;
            font-size: 85% !important;
            text-shadow: none !important;
            background: none !important;
            padding: 0 !important;
        }

        blockquote {
            padding: 0 1em;
            color: var(--quote-color);
            border-left: 0.25em solid var(--border-color);
            margin: 0;
        }
        ul, ol { padding-left: 2em; }
        li + li { margin-top: 0.25em; }
        input[type="checkbox"] { margin-right: 0.5em; vertical-align: middle; }
        hr { height: 0.25em; background-color: var(--border-color); border: 0; margin: 24px 0; }
    </style>
</head>
<body>
    <article class="markdown-body">
        <h1>Hello world</h1>
<h2>Subheading</h2>
<h3>Sub-subheading</h3>
<h4>Sub-sub-subheading</h4>
<h5>Sub-sub-sub-subheading</h5>
<p><a href="https://www.example.com">Link</a></p>
<ul>
<li>Item 1</li>
<li>Item 2</li>
</ul>
<ol>
<li>Item 1</li>
<li>Item 2</li>
</ol>
<p><strong>Bold</strong></p>
<p><em>Italic</em></p>
<pre><code class="language-rust">fn main() {
    println!("Hello, world!");
}
</code></pre>

    </article>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
</body>
</html>
